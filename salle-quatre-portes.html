<body>
<style>
/* Mise en page : une scène 16:9 pixel art au centre ; la salle ou une image de la séquence, zones cliquables posées en %, boîte de dialogue en bas ; panneau d'édition sous la scène. Monde unique sombre, le rouge est réservé aux indices et au mode édition. */
:root {
  --ink: #2b1010;
  --ink-2: #3a1818;
  --bone: #e9dccb;
  --dim: #8c6f66;
  --clue: #c82438;
  --display: "Playfair Display", Georgia, serif;
  --pixel: "Silkscreen", "Courier New", monospace;
  --term: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background: var(--ink); color: var(--bone);
  font-family: var(--term);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px;
  box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
}
body > * { flex-shrink: 0; }
h1 {
  font-family: var(--display); font-weight: 700; margin: 0;
  font-size: clamp(1.6rem, 4.5vw, 3rem); line-height: 1.05; text-wrap: balance; text-align: center;
}
.hint { margin: 0; font-size: 1.25rem; color: var(--dim); letter-spacing: .04em; text-align: center; }
.stage {
  position: relative; width: min(100%, 1280px); aspect-ratio: 16 / 9; max-width: 100%;
  border: 4px solid var(--bone); outline: 4px solid var(--ink); box-shadow: 0 0 0 8px var(--bone);
  overflow: hidden; background: var(--ink);
}
.view { position: absolute; inset: 0; }
[hidden] { display: none !important; }
.room img { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
/* les images de la séquence sont en 3:2, centrées dans la scène 16:9 */
.frame {
  position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
  aspect-ratio: 3 / 2; height: 100%;
}
.frame img { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
.cut { animation: cut .32s steps(3) both; }
.knock { animation: knock .18s steps(3) both; }
@keyframes knock { 33% { transform: translateX(-50%) translate(-3px, 1px); } 66% { transform: translateX(-50%) translate(2px, -1px); } }
.glitch { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
/* Bug de toute l'interface à la fin : secousses + tranches pendant le glitch, puis séquelles qui clignotent. */
body.glitching h1, body.glitching .hint, body.glitching .stage, body.glitching .toolbar, body.glitching .panel {
  animation: uiGlitch .16s steps(2) infinite;
}
body.glitching .hint { animation-duration: .11s; }
body.glitching .toolbar { animation-duration: .2s; }
@keyframes uiGlitch {
  0%   { transform: translate(-5px, 1px) skewX(5deg); clip-path: inset(8% 0 35% 0); text-shadow: 3px 0 var(--clue), -3px 0 var(--bone); }
  50%  { transform: translate(6px, -2px) skewX(-3deg); clip-path: inset(45% 0 4% 0); text-shadow: -4px 0 var(--clue); }
  100% { transform: none; clip-path: inset(0); }
}
body.glitched h1, body.glitched .hint, body.glitched .chip, body.glitched .dialog p { text-shadow: 2px 0 var(--clue), -2px 0 rgb(233 220 203 / .5); }
body.glitched .stage { animation: uiFlicker 2.6s steps(1) infinite; }
body.glitched h1 { animation: uiFlicker 3.4s steps(1) infinite .7s; }
body.glitched .toolbar { animation: uiFlicker 4.1s steps(1) infinite 1.3s; }
@keyframes uiFlicker {
  0%, 90%, 100% { transform: none; clip-path: none; }
  91% { transform: translate(-7px, 0) skewX(6deg); clip-path: inset(18% 0 52% 0); }
  94% { transform: translate(5px, 2px); clip-path: inset(60% 0 8% 0); }
  97% { transform: translate(-2px, -1px); }
}
/* Fenêtres d'erreur qui envahissent l'écran à la fin. Elles laissent passer les clics, sauf leur bouton ×. */
.stage.lost .dialog { display: none; }
.errors {
  position: fixed; inset: 0; z-index: 50; pointer-events: none; overflow: hidden;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
.err {
  position: absolute; width: min(300px, 78vw);
  background: var(--bone); color: var(--ink); border: 3px solid var(--ink);
  box-shadow: 5px 5px 0 var(--ink); font-family: var(--term);
}
.err-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: var(--ink); color: var(--bone); padding: 3px 4px 4px 8px;
  font-family: var(--pixel); font-size: .72rem; line-height: 1;
}
.err-bar button {
  pointer-events: auto; cursor: pointer; width: 20px; height: 18px; line-height: 1;
  border: 2px solid var(--bone); font-family: var(--pixel); font-size: .7rem;
}
.err-bar button:hover, .err-bar button:focus-visible { background: var(--clue); outline: none; }
.err-body { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px 12px; font-size: 1.25rem; line-height: 1.1; }
.err-body b {
  flex: none; width: 26px; height: 26px; display: grid; place-items: center;
  background: var(--clue); color: var(--bone); font-family: var(--pixel); font-size: .9rem;
}
.err-body span { min-width: 0; overflow-wrap: anywhere; }
.err.pop { animation: pop .18s steps(2) both; }
@keyframes pop { 0% { opacity: 0; transform: scale(.9); } 100% { opacity: 1; transform: none; } }
/* Terminal qui s'ouvre quand on ferme l'erreur : fenêtre de terminal réaliste, texte tapé petit à petit. */
.term {
  position: fixed; z-index: 60; left: 50%; top: 50%; translate: -50% -50%;
  width: min(880px, calc(100vw - 32px)); height: min(78vh, 640px);
  display: grid; grid-template-rows: auto 1fr;
  background: #0d0d0d; color: #cfcfcf; border: 1px solid #3a3a3a; border-radius: 8px;
  box-shadow: 0 24px 60px rgb(0 0 0 / .6), 0 0 0 1px rgb(0 0 0 / .8);
  font-family: "IBM Plex Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace;
  overflow: hidden;
}
.term-bar {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
  background: linear-gradient(#2b2b2b, #222); border-bottom: 1px solid #111;
  padding: 7px 10px; font-size: .78rem; color: #a8a8a8;
}
.term-dots { display: flex; gap: 7px; }
.term-dots i { width: 12px; height: 12px; border-radius: 50%; background: #555; display: block; }
.term-dots i:first-child { background: #e0443e; }
.term-dots i:nth-child(2) { background: #dea123; }
.term-dots i:nth-child(3) { background: #1aab29; }
.term-title { text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.term-out {
  margin: 0; padding: 14px 16px 20px; overflow: auto; min-height: 0;
  font-size: clamp(.72rem, 1.6vw, .9rem); line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere;
}
.term-out .prompt { color: #5fd75f; }
.term-out .path { color: #6fa8ff; }
.term-out .sys { color: #ff5f56; font-weight: 600; }
.term-out .frag { color: #fff; font-weight: 600; }
.term-caret { display: inline-block; width: .6em; height: 1.15em; vertical-align: text-bottom; background: #cfcfcf; animation: blink 1s steps(1) infinite; }
.slam { animation: slam .4s steps(6) both; }
@keyframes slam {
  0%, 100% { transform: none; }
  20% { transform: translate(-6px, 3px); }
  40% { transform: translate(5px, -4px); }
  60% { transform: translate(-3px, 2px); }
  80% { transform: translate(2px, -1px); }
}
@keyframes cut { 0% { filter: brightness(0); } 50% { filter: brightness(1.6) contrast(1.4); } 100% { filter: none; } }

.hot {
  position: absolute; border: 2px dashed transparent; cursor: pointer;
  transition: border-color .15s, background-color .15s;
}
/* contour rouge doublé d'un liseré sombre et d'un liseré crème : lisible sur les zones claires comme sombres */
.hot:hover, .hot:focus-visible {
  border: 3px dashed var(--clue); background: rgb(200 36 56 / .06); outline: none;
  box-shadow: 0 0 0 1px var(--ink), inset 0 0 0 1px var(--bone);
}
.door[aria-pressed="true"] { border: 3px solid var(--clue); box-shadow: 0 0 0 1px var(--ink), inset 0 0 0 1px var(--bone); }
.plaque {
  position: absolute; transform: translate(-50%, -100%);
  background: var(--ink); color: var(--bone); border: 3px solid var(--bone);
  font-family: var(--pixel); font-size: clamp(.55rem, 1.5vw, 1.2rem); line-height: 1;
  padding: .15em .5em .25em; pointer-events: none;
}
.chip {
  position: absolute; z-index: 3; top: 3%;
  background: var(--ink); color: var(--bone); border: 3px solid var(--bone);
  font-family: var(--pixel); font-size: clamp(.55rem, 1.4vw, 1rem); line-height: 1;
  padding: .4em .7em .5em; font-variant-numeric: tabular-nums;
}
.back { left: 2%; cursor: pointer; }
.back:hover, .back:focus-visible { background: var(--bone); color: var(--ink); outline: none; }
.count { right: 2%; }
.dialog {
  position: absolute; z-index: 2; left: 11%; right: 11%; bottom: 3.3%;
  background: var(--ink); border: 4px solid var(--bone); padding: 4px;
}
.dialog p {
  margin: 0; border: 2px solid var(--bone); text-align: center;
  font-size: clamp(.95rem, 3vw, 2.5rem); line-height: 1.1; padding: .2em .8em; min-height: 1.1em;
}
.cursor { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ----- Mode édition ----- */
.editing .hot {
  border: 2px dashed var(--clue); background: rgb(200 36 56 / .18);
  cursor: move; touch-action: none; z-index: 4;
}
.editing .hot.sel { border-style: solid; background: rgb(200 36 56 / .3); }
.editing .dialog { pointer-events: none; opacity: .55; }
.grip {
  display: none; position: absolute; right: -7px; bottom: -7px; width: 14px; height: 14px;
  background: var(--clue); border: 2px solid var(--bone); cursor: nwse-resize; touch-action: none;
}
.editing .hot .grip { display: block; }
.tag {
  display: none; position: absolute; left: 0; top: 0; transform: translateY(-100%);
  background: var(--clue); color: var(--bone); font-family: var(--pixel); font-size: .7rem;
  padding: 2px 5px; white-space: nowrap; pointer-events: none;
}
.editing .hot .tag { display: block; }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn {
  border: 3px solid var(--bone); padding: .35em .9em .45em; cursor: pointer;
  font-family: var(--pixel); font-size: .85rem; line-height: 1; background: var(--ink);
}
.btn:hover, .btn:focus-visible { background: var(--bone); color: var(--ink); outline: none; }
.btn[aria-pressed="true"] { background: var(--clue); border-color: var(--clue); color: var(--bone); }
.btn.danger { border-color: var(--clue); }

.panel {
  width: min(100%, 1280px); box-sizing: border-box;
  border: 3px solid var(--clue); background: var(--ink-2); padding: 14px;
  display: grid; gap: 12px;
}
.panel h2 { margin: 0; font-family: var(--pixel); font-size: 1rem; font-weight: 400; color: var(--clue); letter-spacing: .05em; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > * { min-width: 0; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.steps .btn { font-size: .75rem; padding: .3em .6em .4em; }
label.field { display: grid; gap: 4px; flex: 1 1 18rem; font-size: 1.15rem; color: var(--dim); }
.field input {
  font: inherit; font-size: 1.3rem; color: var(--bone); background: var(--ink);
  border: 2px solid var(--dim); padding: .2em .5em; min-width: 0;
}
.field input:focus { border-color: var(--bone); outline: none; }
.coords { font-size: 1.15rem; color: var(--dim); font-variant-numeric: tabular-nums; }
.note { margin: 0; font-size: 1.1rem; color: var(--dim); line-height: 1.3; max-width: 70ch; }
.file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
textarea.out {
  width: 100%; box-sizing: border-box; min-height: 8rem; font-family: "Courier New", monospace; font-size: .8rem;
  color: var(--bone); background: var(--ink); border: 2px solid var(--dim);
}
@media (prefers-reduced-motion: reduce) {
  .cursor, .cut, .slam, .knock, .err, .term-caret, body.glitching *, body.glitched * { animation: none !important; }
  .hot { transition: none; }
}
button { font: inherit; color: inherit; background: none; padding: 0; }
</style>

  wob.connect(wa); wob.start(t); wob.stop(t + dur);
  [[1, .35], [1.007, .3], [.993, .3], [1.414, .22], [.5, .4]].forEach(([mul, gain]) => {
    const o = c.createOscillator(); o.type = "sawtooth";
    o.frequency.setValueAtTime(140 * mul, t);
    o.frequency.exponentialRampToValueAtTime(95 * mul, t + .35);
    o.frequency.exponentialRampToValueAtTime(80 * mul, t + 1.4);
    o.frequency.exponentialRampToValueAtTime(42 * mul, t + dur);
    wa.connect(o.frequency);
    const g = c.createGain(); g.gain.value = gain;
    o.connect(g); formants.forEach(f => g.connect(f));
    o.start(t); o.stop(t + dur);
  });
  // sub-basse qui fait trembler
  const sub = c.createOscillator(); sub.type = "sine";
  sub.frequency.setValueAtTime(55, t); sub.frequency.exponentialRampToValueAtTime(28, t + dur);
  const sg = c.createGain(); sg.gain.setValueAtTime(.9, t); sg.gain.exponentialRampToValueAtTime(.001, t + dur);
  sub.connect(sg); sg.connect(out); sub.start(t); sub.stop(t + dur);
  // grondement : bruit filtré très bas, saturé avec le reste
  const len = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let k = 0; k < len; k++) d[k] = Math.random() * 2 - 1;
  const n = c.createBufferSource(); n.buffer = buf;
  const nl = c.createBiquadFilter(); nl.type = "lowpass"; nl.frequency.value = 260;
  const ng = c.createGain(); ng.gain.value = 1.2;
  n.connect(nl); nl.connect(ng); ng.connect(shaper); n.start(t);
}
function knockSound() {
  const c = actx;
  if (!c) return;
  const t = c.currentTime;
  const o = c.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(70, t + .08);
  const g = c.createGain(); g.gain.setValueAtTime(.7, t); g.gain.exponentialRampToValueAtTime(.001, t + .15);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + .16);
}
function knockDoor() {
  knocks++;
  knockSound();
  if (knocks < DOOR_KNOCKS) {
    if (!reduce) { frame.classList.remove("knock", "cut"); void frame.offsetWidth; frame.classList.add("knock"); }
    return;
  }
  freezeAndGlitch();
}
// Glitch : l'image se fige, des bandes horizontales se décalent et se teintent, puis un dossier apparaît.
function freezeAndGlitch() {
  clearEnding(); clearExtras();
  const W = 300, H = 200;
  const c = glitchCanvas = document.createElement("canvas");
  c.width = W; c.height = H; c.className = "glitch";
  c.setAttribute("aria-hidden", "true");
  frame.append(c);
  const g = c.getContext("2d");
  const base = document.createElement("canvas"); base.width = W; base.height = H;
  base.getContext("2d").drawImage(frameImg, 0, 0, W, H);
  function draw(strength) {
    g.drawImage(base, 0, 0);
    const n = Math.round(4 + strength * 10);
    for (let k = 0; k < n; k++) {
      const y = Math.floor(Math.random() * H), h = 2 + Math.floor(Math.random() * 14 * strength + 2);
      const dx = Math.round((Math.random() * 2 - 1) * 40 * strength);
      g.drawImage(base, 0, y, W, h, dx, y, W, h);
      if (Math.random() < .4) {
        g.fillStyle = Math.random() < .5 ? "rgba(200,36,56,.55)" : "rgba(233,220,203,.5)";
        g.fillRect(0, y, W, Math.max(1, h >> 1));
      }
    }
  }
  say("…");
  clearInterval(timer); line.textContent = "…";
  const frames = reduce ? 1 : 14;
  uiGlitchStart(frames * 70 + 250);
  for (let k = 0; k < frames; k++) {
    endTimers.push(setTimeout(() => draw(1 - k / frames * .7), k * 70));
  }
  endTimers.push(setTimeout(() => {
    draw(.25);   // l'image reste figée sur un dernier glitch
  }, frames * 70 + 250));
}

function showStep(i, quiet) {
  view = i; ended = false;
  clearEnding(); clearExtras();
  const s = steps()[i];
  room.hidden = true; seq.hidden = false;
  frameImg.src = srcOf(s);
  frameImg.alt = s.text;
  frame.classList.remove("cut"); void frame.offsetWidth;
  if (!reduce && !quiet) frame.classList.add("cut");
  const last = i === steps().length - 1;
  $("back").hidden = false; $("count").hidden = false;
  if (last && cur === UNLOCKED_BY && !editing) bedroomOpen = true;
  $("count").textContent = (i + 1) + " / " + steps().length;
  // la dernière image termine la séquence : pas de zone cliquable hors mode édition
  seqHot.hidden = last && !editing;
  if (last && !editing && cur === SEQ_WITH_ENDING) scheduleEnding();
  place(seqHot, s.hot);
  seqHot.querySelector(".tag").textContent = "Zone " + (i + 1);
  seqHot.setAttribute("aria-label", "Continuer");
  say(s.text);
  refreshEditor();
}
function showRoom(text) {
  view = "room"; ended = false;
  clearEnding(); clearExtras();
  seq.hidden = true; room.hidden = false;
  doorEls.forEach(o => o.setAttribute("aria-pressed", "false"));
  if (text) say(text);
  refreshEditor();
}
function enterSequence(key) { cur = key; showStep(0); if (!editing) seqHot.focus({ preventScroll: true }); }
$("back").addEventListener("click", () => showRoom("Tu refermes la porte " + cur + " derrière toi."));

function refreshEditor() {}
function refreshCoords() {}

line.textContent = "Quatre portes. Une seule mène à Donna.";
</script>
